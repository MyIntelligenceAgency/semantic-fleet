#
# This workflow will build and run all tests using dotnet docker containers,
# each targeting a single version of the dotnet SDK.
#

name: dotnet-ci

on:
  workflow_dispatch:
  schedule:
    - cron:  '0 7 * * *'

permissions:
  contents: read

jobs:
  build-and-test-docker:
    strategy:
      fail-fast: false
      matrix:
        include:
          - dotnet: '8.0'
            configuration: Release
            solutions: dotnet/Semantic-Fleet-dotnet.sln
          - dotnet: '9.0'
            configuration: Debug
            solutions: dotnet/Semantic-Fleet-dotnet.sln semantic-fleet.sln
          - dotnet: '9.0'
            configuration: Release
            solutions: dotnet/Semantic-Fleet-dotnet.sln semantic-fleet.sln

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        clean: true
        
    - name: Pull container dotnet/sdk:${{ matrix.dotnet }}
      run: |
        docker pull mcr.microsoft.com/dotnet/sdk:${{ matrix.dotnet }}

    - name: Build
      run: |
        for solution in ${{ matrix.solutions }}; do
          docker run --rm -v $(pwd):/app -w /app -e GITHUB_ACTIONS='true' mcr.microsoft.com/dotnet/sdk:${{ matrix.dotnet }} /bin/sh -c "dotnet build -c ${{ matrix.configuration }} /app/$solution"
        done
        
    - name: Find test projects
      shell: bash
      run: echo "testprojects=$(find ./dotnet -type f -name "*Tests.csproj" | tr '\n' ' ')" >> $GITHUB_ENV

    - name: Run Tests
      shell: bash
      run: |
        set -e
        for project in ${{ env.testprojects }}; do
          test_command="dotnet test -c ${{ matrix.configuration }} /app/$project --no-build -v Normal --logger trx --results-directory /app/TestResults -- xUnit.ParallelizeTestCollections=false"
          docker run --rm -v $(pwd):/app -w /app mcr.microsoft.com/dotnet/sdk:${{ matrix.dotnet }} /bin/sh -c "$test_command" || {
            echo "::warning::Test project $project failed once; retrying to distinguish transient failures"
            docker run --rm -v $(pwd):/app -w /app mcr.microsoft.com/dotnet/sdk:${{ matrix.dotnet }} /bin/sh -c "$test_command"
          }
        done

    - name: Upload dotnet test results
      uses: actions/upload-artifact@v4
      with:
        name: dotnet-testresults-linux-${{ matrix.dotnet }}-${{ matrix.configuration }}
        path: ./TestResults
      if: ${{ always() }}

  build-and-test-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - dotnet-version: '8.0.x'
            configuration: Release
            solutions: dotnet/Semantic-Fleet-dotnet.sln
          - dotnet-version: '9.0.x'
            configuration: Debug
            solutions: dotnet/Semantic-Fleet-dotnet.sln semantic-fleet.sln
          - dotnet-version: '9.0.x'
            configuration: Release
            solutions: dotnet/Semantic-Fleet-dotnet.sln semantic-fleet.sln
    runs-on: windows-latest
    env:
      NUGET_CERT_REVOCATION_MODE: offline
    steps:
    - uses: actions/checkout@v4
      with:
        clean: true

    - name: Setup .NET SDK ${{ matrix.dotnet-version }}
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ matrix.dotnet-version }}
      env:
        NUGET_AUTH_TOKEN: ${{ secrets.GPR_READ_TOKEN }}

    - uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        # Look to see if there is a cache hit for the corresponding requirements file
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget

    - name: Restore dependencies
      shell: bash
      run: |
        for solution in ${{ matrix.solutions }}; do
          dotnet restore $solution
        done

    - name: Build
      shell: bash
      run: |
        for solution in ${{ matrix.solutions }}; do
          dotnet build $solution --no-restore --configuration ${{ matrix.configuration }}
        done

    - name: Find test projects
      shell: bash
      run: echo "testprojects=$(find ./dotnet -type f -name "*Tests.csproj" | tr '\n' ' ')" >> $GITHUB_ENV

    - name: Run Tests
      shell: bash
      run: |
        set -e
        for project in ${{ env.testprojects }}; do
          dotnet test $project --verbosity normal --logger trx --results-directory ./TestResults --configuration ${{ matrix.configuration }} -- xUnit.ParallelizeTestCollections=false || {
            echo "::warning::Test project $project failed once; retrying to distinguish transient failures"
            dotnet test $project --verbosity normal --logger trx --results-directory ./TestResults --configuration ${{ matrix.configuration }} -- xUnit.ParallelizeTestCollections=false
          }
        done

    - name: Upload dotnet test results
      uses: actions/upload-artifact@v4
      with:
        name: dotnet-testresults-windows-${{ matrix.dotnet-version }}-${{ matrix.configuration }}
        path: ./TestResults
      if: ${{ always() }}
