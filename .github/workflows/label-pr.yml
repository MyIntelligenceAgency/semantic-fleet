# This workflow will triage pull requests and apply a label based on the
# paths that are modified in the pull request.
#
# To use this workflow, you will need to set up a .github/labeler.yml
# file with configuration.  For more information, see:
# https://github.com/actions/labeler

name: Label pull request
on: [pull_request_target]

jobs:
  add_label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/labeler@v4
        with:
          # GH_ACTIONS_PR_WRITE n est pas defini sur ce depot : le labeler recevait un
          # token vide et mourait (Parameter token or opts.auth is required) sur chaque
          # PR -- y compris #112/#113. github.token porte deja pull-requests: write.
          repo-token: "${{ github.token }}"
